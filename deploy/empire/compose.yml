# Three-Way Empire — self-hosted stack (Podman or Docker)
#   podman compose -f deploy/empire/compose.yml --env-file deploy/empire/.env up -d --build
# Or just run deploy/empire/deploy.ps1 (Windows) / deploy.sh (Linux, macOS).

services:
  empire:
    build:
      context: ../..
      dockerfile: deploy/empire/Containerfile
    image: localhost/nova-empire:latest
    container_name: empire-api
    restart: unless-stopped
    ports:
      - "${EMPIRE_PORT:-8080}:8080"
    environment:
      EMPIRE_ADMIN_KEY: ${EMPIRE_ADMIN_KEY:?set EMPIRE_ADMIN_KEY in deploy/empire/.env}
      EMPIRE_LLM: ${EMPIRE_LLM:-ollama}
      EMPIRE_MODEL: ${EMPIRE_MODEL:-llama3.1:8b}
      OLLAMA_URL: http://ollama:11434
      EMPIRE_SCALING_INTERVAL: ${EMPIRE_SCALING_INTERVAL:-2}
      GITEA_BASE_URL: ${GITEA_BASE_URL:-http://localhost:3000}
    volumes:
      - empire-data:/data
    depends_on:
      - ollama

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: empire-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Not published to the host: only the empire service talks to the model.

  # One-shot: downloads the model into the shared volume, then exits.
  ollama-pull:
    image: docker.io/ollama/ollama:latest
    container_name: empire-ollama-pull
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5; ollama pull ${EMPIRE_MODEL:-llama3.1:8b}"]
    depends_on:
      - ollama
    restart: "no"

volumes:
  empire-data:
  ollama-models:
